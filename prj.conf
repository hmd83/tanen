# TanenBase base config
CONFIG_GPIO=y
CONFIG_LOG=y
# LOG_DEFAULT_LEVEL not set here (Zephyr default is already 3=INF). Assigning it
# here makes prj_production.conf's CONFIG_LOG=n a fatal Kconfig warning.

# --- Robustness (TRD 13.1 / AC-10) ---
# Task watchdog (sw, per-flow channel) + WDT31 hardware fallback.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
# Fatal error (HardFault/BusFault/oops) → NCS handler (nrf/lib/fatal_error)
# does LOG_PANIC + cold reboot instead of parking the CPU forever.
CONFIG_RESET_ON_FATAL_ERROR=y
# MPU stack-overflow trap on every thread (fails fast into fault handler
# instead of silently corrupting the neighbour stack)
CONFIG_HW_STACK_PROTECTION=y
# Thread names in fault logs
CONFIG_THREAD_NAME=y

# UART off by default (battery mode) — enable via debug.conf overlay
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# I2C (NAU7802 driven directly from src/drivers/weight.c)
CONFIG_I2C=y
CONFIG_I2C_GPIO=y

# DS18B20 temperature (1-Wire)
CONFIG_SENSOR=y
CONFIG_W1=y
CONFIG_DS18B20=y

# Battery via on-board nPM1300 charger (bit-banged pmic_i2c, SDA P1.18/SCL P1.17).
# The driver's init leaves ADC IBAT_EN + TASK_AUTO running, and the nPM1300 is
# on VBAT so those keep converting through the SoC's System OFF — power.c
# pmic_enter_sleep() clears them before poweroff. Charging itself is deleted in
# the overlay (primary cell). Do not enable NPM13XX without that sleep hook.
CONFIG_NPM13XX_CHARGER=y
# LDO1 (imu_vdd/dmic_vdd, Sense-only rail) must stay off — no regulator driver,
# nPM1300 POR default is off
CONFIG_REGULATOR_NPM13XX=n

# LoRaWAN
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_EU868=y
CONFIG_SPI=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ZMS for nonce persistence (direct, not via settings — settings_zms broken on nRF54L RRAM)
CONFIG_ZMS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_SIZE=128

# RX window timing tolerance (ms). Default 20 is too tight; 500 is far too wide —
# it stretches RX1 past the RX2 slot, and OnRxWindow2TimerEvent() returns early
# whenever RxSlot is still RX_SLOT_WIN_1, so RX2 never opened at ANY DR (join or
# uplink). At DR0 that is fatal: TTN moves an SF12 join-accept to RX2 when the
# gateway cannot afford 1.5 s of g1 airtime. 100 keeps RX1 at 4950-5310 ms, well
# clear of the 5950 ms RX2 timer.
CONFIG_LORAWAN_SYSTEM_MAX_RX_ERROR=100

# Disable settings subsystem (LoRaWAN NVM will use none)
CONFIG_LORAWAN_NVM_NONE=y

# RNG for LoRaMAC internals (channel hop / backoff). DevNonce is NOT random —
# it is a monotonic counter persisted in ZMS (see config_get_dev_nonce).
CONFIG_ENTROPY_GENERATOR=y

# Power management — System OFF with GRTC wake, CPU idle during k_sleep.
# NOTE: CONFIG_PM is NOT settable on nRF54L series (no HAS_PM) — idle states are
# handled by the SoC layer; do not re-add it, it silently resolves to n.
CONFIG_POWEROFF=y
CONFIG_PM_DEVICE=y
CONFIG_HWINFO=y

# BLE (SETUP mode config service via Web Bluetooth)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TanenBase"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1

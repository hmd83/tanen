name: oshwa-badge

on:
  push:
    paths:
      - '.github/workflows/oshwa-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add OSHWA UID DE000178
        run: |
          python3 - <<'PY'
          import io, os, sys

          CARD = {
              "site/index.html": (
                  "Zertifiziertes Open Source Hardware",
                  'TanenBase ist von der Open Source Hardware Association als Open Source Hardware zertifiziert, UID <a href="https://certification.oshwa.org/de000178.html" rel="noopener">DE000178</a>. Die Zertifizierung bestätigt, dass Hardware-Design, Software und Dokumentation offen sind und nachgebaut werden können.',
              ),
              "site/en/index.html": (
                  "Certified open source hardware",
                  'TanenBase is certified open source hardware by the Open Source Hardware Association, UID <a href="https://certification.oshwa.org/de000178.html" rel="noopener">DE000178</a>. The certification confirms that the hardware design, the software and the documentation are open and can be rebuilt.',
              ),
              "site/ar/index.html": (
                  "عتاد مفتوح المصدر معتمد",
                  '‏TanenBase معتمد كعتاد مفتوح المصدر من رابطة العتاد المفتوح المصدر، برقم <a href="https://certification.oshwa.org/de000178.html" rel="noopener">DE000178</a>. الشهادة تؤكد أن تصميم العتاد والبرمجية والتوثيق مفتوحة وقابلة لإعادة البناء.',
              ),
          }

          def read(p):
              with io.open(p, encoding="utf-8") as f:
                  return f.read()

          def write(p, s):
              with io.open(p, "w", encoding="utf-8", newline="") as f:
                  f.write(s)

          changed = []

          for path, (h3, para) in CARD.items():
              s = read(path)
              if "DE000178" in s:
                  continue
              i = s.find('<section class="band" id="open">')
              if i < 0:
                  raise SystemExit("no open section in " + path)
              j = s.find("</section>", i)
              k = s.rfind("</article>", i, j)
              if k < 0:
                  raise SystemExit("no card anchor in " + path)
              k += len("</article>")
              block = (
                  '\n      <article class="card">\n'
                  '        <h3 data-i18n="o5T">' + h3 + "</h3>\n"
                  '        <p data-i18n="o5D">' + para + "</p>\n"
                  "      </article>"
              )
              write(path, s[:k] + block + s[k:])
              changed.append(path)

          BADGE = '[![OSHWA](https://img.shields.io/badge/OSHWA%20certified-DE000178-2ea44f.svg)](https://certification.oshwa.org/de000178.html)'

          s = read("README.md")
          if "DE000178" not in s:
              anchor = '[![SDK](https://img.shields.io/badge/nRF%20Connect%20SDK-v3.4.0-purple.svg)](https://developer.nordicsemi.com/)'
              assert s.count(anchor) == 1
              s = s.replace(anchor, anchor + "\n" + BADGE)
              anchor2 = "## License\n"
              assert s.count(anchor2) == 1
              s = s.replace(
                  anchor2,
                  "### OSHWA certification\n\n"
                  "TanenBase is certified open source hardware by the [Open Source Hardware\n"
                  "Association](https://www.oshwa.org/), UID **DE000178** \u2014 see the\n"
                  "[certification record](https://certification.oshwa.org/de000178.html). The\n"
                  "certification confirms that the hardware design, the software and the\n"
                  "documentation are open and can be rebuilt from what is published here.\n\n"
                  + anchor2,
              )
              write("README.md", s)
              changed.append("README.md")

          s = read("README.ar.md")
          if "DE000178" not in s:
              anchor = "[![الترخيص](https://img.shields.io/badge/license-Apache--2.0-blue.svg)](LICENSE)"
              assert s.count(anchor) == 1
              s = s.replace(anchor, anchor + "\n" + BADGE)
              anchor2 = "## روابط\n"
              assert s.count(anchor2) == 1
              s = s.replace(
                  anchor2,
                  "## شهادة العتاد المفتوح المصدر\n\n"
                  "TanenBase معتمد كعتاد مفتوح المصدر من "
                  "[رابطة العتاد المفتوح المصدر](https://www.oshwa.org/)، برقم **DE000178** \u2014 "
                  "انظر [سجل الشهادة](https://certification.oshwa.org/de000178.html). "
                  "الشهادة تؤكد أن تصميم العتاد والبرمجية والتوثيق مفتوحة، وأن الجهاز قابل "
                  "لإعادة البناء مما هو منشور في المستودع.\n\n" + anchor2,
              )
              write("README.ar.md", s)
              changed.append("README.ar.md")

          print("changed:", ", ".join(changed) if changed else "(nothing)")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "docs: add OSHWA certification UID DE000178 to README and site"
            git push
          fi

# Debug overlay — enable console logging (deferred mode to not block RX windows).
# Console = uart20 (board default chosen zephyr,console), TX P1.11 / RX P1.10 ->
# on-board CMSIS-DAP VCOM -> COM port @115200. The nRF's own USBHS CDC console
# (cdc-acm-console snippet) does NOT enumerate on this board — see build.ps1.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_ZMS_LOG_LEVEL_DBG=y

# USBHS needs the vregusb (USB VBUS) regulator device (nrf_usbhs_wrapper.c)
CONFIG_REGULATOR=y

# Debug-only runtime checks (cost RAM/flash — never in production)
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=60

# Disable System OFF in debug — set to 0 so power_off() returns without sleeping
CONFIG_TANENBASE_DEFAULT_MS_INTERVAL=60
<!doctype html>
<!--
  GitHub social preview for hmd83/tanen (1280 x 640). Render to PNG with:
    chrome --headless=new --hide-scrollbars --window-size=1280,640 ^
           --screenshot=media\brand\social-preview.png media\brand\social-preview.html
  then upload it in the repo's Settings > General > Social preview.
  Colours and type follow the Tanen design system (site/index.html tokens).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>TanenBase social preview</title>
<style>
  :root {
    --bg: #eaeef5; --surface: #ffffff; --border-strong: #4a5568;
    --text: #0c1017; --dim: #39445a;
    --accent: #f0a500; --accent-ink: #231800; --accent-edge: #a06d00;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: 1fr 440px; gap: 56px;
    padding: 64px 72px;
  }
  .copy { display: flex; flex-direction: column; justify-content: center; gap: 28px; min-width: 0; }
  .lockup { width: 470px; height: auto; display: block; margin-left: -9px; }
  h1 { font-size: 46px; line-height: 1.12; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  p { font-size: 25px; line-height: 1.45; color: var(--dim); max-width: 42ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 12px; }
  .fact {
    font-size: 21px; font-weight: 700; padding: 8px 18px;
    background: var(--surface); border: 3px solid var(--border-strong); border-radius: 999px;
  }
  .fact.url { background: var(--accent); border-color: var(--accent-edge); color: var(--accent-ink); font-weight: 800; }
  .photo {
    border: 3px solid var(--border-strong); border-radius: 18px; overflow: hidden;
    background: var(--surface);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <img class="lockup" src="../../site/tanenbase-lockup.svg" alt="TanenBase">
    <h1>Open-source LoRaWAN hive scale</h1>
    <p>Weighs the hive and reads its temperature, reports to The Things Network, then sleeps at about 4&nbsp;µA. Years on three AAA cells.</p>
    <div class="facts">
      <span class="fact">BEEP &amp; beelogger</span>
      <span class="fact">No subscription</span>
      <span class="fact url">tanen.eu</span>
    </div>
  </div>
  <div class="photo">
    <img src="../../site/media/buehl-hive.jpg" alt="Beehive on the TanenBase platform in Bühl, with the station enclosure underneath">
  </div>
</body>
</html>

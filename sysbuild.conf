# OTA readiness (TRD: MCUboot) — build with:  west build --sysbuild
#
# NCS Partition Manager lays out: mcuboot / mcuboot_primary / mcuboot_secondary,
# with zms_storage pinned by pm_static.yml (see that file — the pin is what
# keeps DevNonce/session/config alive across app-size changes and OTA).
#
# PRODUCTION: replace the default dev signing key before deployment:
#   SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="C:/keys/tanenbase-mcuboot-ed25519.pem"
# Key stays OUT of the repo (same policy as prj_credentials.conf).
SB_CONFIG_BOOTLOADER_MCUBOOT=y

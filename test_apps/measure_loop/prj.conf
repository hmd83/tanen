# test_app: measure_loop — minimal sensor stack, no LoRa/BLE/PM.
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# UART logging ON so values are visible when J-Link/serial is attached.
# Device still runs the loop with USB unplugged — logs just go nowhere.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096

# I2C — NAU7802 over sw-I2C @ 100 kHz STANDARD
CONFIG_I2C=y
CONFIG_I2C_GPIO=y

# DS18B20 temperature (1-Wire)
CONFIG_SENSOR=y
CONFIG_W1=y
CONFIG_DS18B20=y

# Battery via on-board nPM1300 charger (bit-banged pmic_i2c)
CONFIG_NPM13XX_CHARGER=y
# USB CDC-ACM console: USBHS needs the vregusb regulator device
CONFIG_REGULATOR=y
# LDO1 (imu_vdd, Sense-only rail) stays off — no regulator driver
CONFIG_REGULATOR_NPM13XX=n

# ZMS — config.c persists OCAL1 + zero/scale cal between cycles
CONFIG_ZMS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_SIZE=128

# RNG (config.c uses sys_rand16_get even though we never read DevNonce)
CONFIG_ENTROPY_GENERATOR=y

CONFIG_HWINFO=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# System OFF with GRTC wake (same as main app).
# CONFIG_PM is not settable on nRF54L series (no HAS_PM) — do not add it.
CONFIG_POWEROFF=y
CONFIG_PM_DEVICE=y
CONFIG_REBOOT=y
